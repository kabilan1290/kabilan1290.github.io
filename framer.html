
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>PostgREST Localhost Port POC</title>
  <style>
    body {
      background: #101214;
      color: #e7e7e7;
      font-family: Arial, sans-serif;
      margin: 24px;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 16px;
    }

    .line {
      margin: 10px 0;
    }

    pre {
      background: #1c2024;
      border: 1px solid #343a40;
      border-radius: 6px;
      color: #d7f3ff;
      overflow: auto;
      padding: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error {
      color: #ffb4a9;
    }
  </style>
</head>
<body>
  <h1>Localhost PostgREST POC</h1>

  <script>
    const ports = [8000, 8001, 3000];

    function writeLine(text, className) {
      document.write('<div class="' + (className || 'line') + '">' + escapeHtml(text) + '</div>');
    }

    function writePre(label, value) {
      document.write('<div class="line">' + escapeHtml(label) + '</div>');
      document.write('<pre>' + escapeHtml(pretty(value)) + '</pre>');
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function pretty(value) {
      try {
        return JSON.stringify(JSON.parse(value), null, 2);
      } catch (error) {
        return value;
      }
    }

    async function fetchText(url) {
      const response = await fetch(url, {
        method: 'GET',
        cache: 'no-store'
      });

      const text = await response.text();
      return {
        ok: response.ok,
        status: response.status,
        text
      };
    }

    async function findPort() {
      for (const port of ports) {
        const url = 'http://localhost:' + port + '/';

        try {
          const result = await fetchText(url);
          return {
            port,
            url,
            result
          };
        } catch (error) {
          writeLine('port ' + port + ' not responding');
        }
      }

      return null;
    }

    (async function run() {
      writeLine('scanning ports: ' + ports.join(', '));

      const found = await findPort();
      if (!found) {
        writeLine('no requested localhost ports responded', 'error');
        return;
      }

      document.write('<h2>port found ' + found.port + '</h2>');
      writeLine('reading data');
      writePre(found.url, found.result.text);
      writeLine('identified as postgrest');

      const systemsUrl = 'http://localhost:' + found.port + '/systems?limit=300';
      writeLine('reading systems data');

      try {
        const systems = await fetchText(systemsUrl);
        writePre(systemsUrl, systems.text);
      } catch (error) {
        writeLine('failed to fetch ' + systemsUrl + ': ' + error.message, 'error');
      }
    })();
  </script>
</body>
</html>
